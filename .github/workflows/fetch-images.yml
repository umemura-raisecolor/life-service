name: fetch-images
on:
  push:
    paths: [images.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from the current site
        run: |
          mkdir -p img
          while read -r n; do
            [ -z "$n" ] && continue
            [ -f "img/$n" ] && continue
            curl -sSfL -m 30 -o "img/$n" "http://www.l-service.net/_p/6059/images/pc/$n" || echo "failed: $n"
          done < images.txt
          ls img | wc -l
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add photos" && git push
